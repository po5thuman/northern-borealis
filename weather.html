<!-- LIVE 3-DAY AURORA FORECAST SECTION -->
<section class="section">
  <div class="container">
    <h2 class="section-title">3-Day Aurora Forecast</h2>
    <p class="section-sub">Space weather is most accurate 3 days in advance (the time it takes solar wind to reach Earth). Live data sourced directly from NOAA.</p>

    <style>
      #forecast-container {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 24px;
        margin-top: 36px;
      }
      .kp-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 34px 24px;
        text-align: center;
        transition: transform 0.2s ease, border-color 0.2s ease;
      }
      .kp-card:hover {
        transform: translateY(-4px);
        border-color: rgba(95,214,165,0.4);
        background: var(--card-hover);
      }
      .kp-date {
        color: var(--muted);
        font-size: 0.95rem;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        font-weight: 600;
        margin-bottom: 20px;
      }
      .kp-circle {
        width: 76px;
        height: 76px;
        margin: 0 auto 20px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Sora', sans-serif;
        font-weight: 800;
        font-size: 2rem;
        color: #052018;
        box-shadow: 0 4px 14px rgba(0,0,0,0.2);
      }
      .kp-label {
        font-family: 'Sora', sans-serif;
        font-weight: 700;
        font-size: 1.15rem;
        color: var(--text);
        margin-bottom: 10px;
      }
      .kp-desc {
        font-size: 0.95rem;
        color: var(--muted);
        line-height: 1.6;
        margin: 0;
      }
      #forecast-msg {
        text-align: center;
        color: var(--muted);
        padding: 40px;
        grid-column: 1 / -1;
        background: var(--bg2);
        border-radius: 16px;
        border: 1px dashed var(--border);
      }
      @media (max-width: 768px) {
        #forecast-container {
          grid-template-columns: 1fr;
          gap: 16px;
        }
        .kp-card {
          padding: 24px;
        }
      }
    </style>

    <div id="forecast-container">
      <div id="forecast-msg">Fetching live space weather data from NOAA...</div>
    </div>

  </div>

  <script>
    document.addEventListener("DOMContentLoaded", async function() {
      const container = document.getElementById('forecast-container');
      
      try {
        // Fetch official forecast from NOAA SWPC
        const response = await fetch('https://services.swpc.noaa.gov/products/27-day-planetary-k-index.json');
        if (!response.ok) throw new Error("Network response was not ok");
        
        const data = await response.json();
        data.shift(); // Remove the header row
        
        // Find today's date
        const todayStr = new Date().toISOString().split('T')[0];
        let startIndex = data.findIndex(row => row[0] >= todayStr);
        if (startIndex === -1) startIndex = 0; 
        
        // Slice exactly 3 days
        const next3Days = data.slice(startIndex, startIndex + 3);
        
        // Clear the loading message
        container.innerHTML = '';
        
        next3Days.forEach((day, index) => {
          const dateStr = day[0];
          const kpVal = parseFloat(day[1]);
          
          // Format the date (Today, Tomorrow, Day 3)
          let formattedDate;
          if (index === 0) formattedDate = "Today";
          else if (index === 1) formattedDate = "Tomorrow";
          else {
            const dateObj = new Date(dateStr);
            formattedDate = dateObj.toLocaleDateString('en-GB', { weekday: 'long', month: 'short', day: 'numeric' });
          }
          
          // Determine Colour, Label, and Description based on Kp strength
          let bgGradient = "linear-gradient(135deg, #7cc5d9, #5fd6a5)"; // Default Green
          let label = "Quiet";
          let desc = "Visible in the high Arctic (Tromsø, Svalbard, Lapland) on clear nights.";
          
          if (kpVal >= 3 && kpVal < 5) {
            bgGradient = "linear-gradient(135deg, #ffd166, #f4a261)"; // Yellow
            label = "Active";
            desc = "Great conditions. Visible across all of Iceland and northern Scandinavia.";
          } else if (kpVal >= 5 && kpVal < 7) {
            bgGradient = "linear-gradient(135deg, #ef476f, #e01e37)"; // Red
            label = "Geomagnetic Storm";
            desc = "Aurora moving south. Extremely bright, active displays expected up north.";
          } else if (kpVal >= 7) {
            bgGradient = "linear-gradient(135deg, #b5179e, #7209b7)"; // Purple
            label = "Major Storm!";
            desc = "Rare, intense event. Aurora may be visible across central Europe and the UK.";
          }

          // Generate HTML for the card
          const card = document.createElement('div');
          card.className = 'kp-card';
          card.innerHTML = `
            <div class="kp-date">${formattedDate}</div>
            <div class="kp-circle" style="background: ${bgGradient};">
              ${kpVal}
            </div>
            <div class="kp-label">${label}</div>
            <p class="kp-desc">${desc}</p>
          `;
          
          container.appendChild(card);
        });

      } catch (error) {
        console.error("Error fetching aurora forecast:", error);
        container.innerHTML = '<div id="forecast-msg">Unable to load forecast data at this time. Please try again later.</div>';
      }
    });
  </script>
</section>
<!-- END LIVE 3-DAY AURORA FORECAST SECTION -->
