<!-- LIVE AURORA FORECAST SECTION -->
<section class="section">
  <div class="container">
    <h2 class="section-title">7-Day Aurora Forecast (Kp Index)</h2>
    <p class="section-sub">Live data sourced directly from the NOAA Space Weather Prediction Center. A Kp of 2-3 is plenty for sightings in the far north (Tromsø, Svalbard, Lapland).</p>
    
    <style>
      /* Forecast specific styles */
      #forecast-container {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 12px;
        margin-top: 30px;
      }
      .kp-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 20px 10px;
        text-align: center;
        transition: transform 0.2s ease;
      }
      .kp-card:hover {
        transform: translateY(-4px);
        background: var(--card-hover);
      }
      .kp-date {
        color: var(--muted);
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: 600;
        margin-bottom: 12px;
      }
      .kp-circle {
        width: 54px;
        height: 54px;
        margin: 0 auto 12px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Sora', sans-serif;
        font-weight: 800;
        font-size: 1.4rem;
        color: #052018;
      }
      .kp-label {
        font-weight: 600;
        font-size: 0.9rem;
        color: var(--text);
      }
      /* Loading & Error States */
      #forecast-msg {
        text-align: center;
        color: var(--muted);
        padding: 40px;
        grid-column: 1 / -1;
        background: var(--bg2);
        border-radius: 16px;
        border: 1px dashed var(--border);
      }
      
      @media (max-width: 960px) {
        #forecast-container {
          grid-template-columns: repeat(4, 1fr);
        }
      }
      @media (max-width: 640px) {
        #forecast-container {
          grid-template-columns: repeat(2, 1fr);
        }
        /* Make today span full width on mobile */
        .kp-card:first-child {
          grid-column: 1 / -1;
          display: flex;
          align-items: center;
          justify-content: space-around;
          padding: 16px;
        }
        .kp-card:first-child .kp-date { margin-bottom: 0; }
        .kp-card:first-child .kp-circle { margin: 0; }
      }
    </style>

    <div id="forecast-container">
      <div id="forecast-msg">Fetching live space weather data from NOAA...</div>
    </div>

  </div>

  <script>
    document.addEventListener("DOMContentLoaded", async function() {
      const container = document.getElementById('forecast-container');
      
      try {
        // Fetch official 27-day forecast from NOAA SWPC
        const response = await fetch('https://services.swpc.noaa.gov/products/27-day-planetary-k-index.json');
        if (!response.ok) throw new Error("Network response was not ok");
        
        const data = await response.json();
        
        // Remove the header row ["time_tag", "kp"]
        data.shift(); 
        
        // Find today's date in YYYY-MM-DD format
        const todayStr = new Date().toISOString().split('T')[0];
        
        // Find where today's data starts in the NOAA array
        let startIndex = data.findIndex(row => row[0] >= todayStr);
        if (startIndex === -1) startIndex = 0; // Fallback just in case
        
        // Get exactly the next 7 days
        const next7Days = data.slice(startIndex, startIndex + 7);
        
        // Clear the loading message
        container.innerHTML = '';
        
        next7Days.forEach(day => {
          const dateStr = day[0];
          const kpVal = parseFloat(day[1]);
          
          // Format date to "Mon, Oct 24"
          const dateObj = new Date(dateStr);
          const formattedDate = dateObj.toLocaleDateString('en-GB', { weekday: 'short', month: 'short', day: 'numeric' });
          
          // Determine Colour and Label based on Kp strength
          let bgGradient = "linear-gradient(135deg, #7cc5d9, #5fd6a5)"; // Default Green (Low)
          let label = "Quiet";
          
          if (kpVal >= 4 && kpVal < 5) {
            bgGradient = "linear-gradient(135deg, #ffd166, #f4a261)"; // Yellow (Active)
            label = "Active";
          } else if (kpVal >= 5 && kpVal < 7) {
            bgGradient = "linear-gradient(135deg, #ef476f, #e01e37)"; // Red (Minor Storm)
            label = "Storm";
          } else if (kpVal >= 7) {
            bgGradient = "linear-gradient(135deg, #b5179e, #7209b7)"; // Purple (Major Storm)
            label = "Major Storm";
          }

          // Generate HTML for the card
          const card = document.createElement('div');
          card.className = 'kp-card';
          card.innerHTML = `
            <div class="kp-date">${formattedDate}</div>
            <div class="kp-circle" style="background: ${bgGradient};">
              ${kpVal}
            </div>
            <div class="kp-label">${label}</div>
          `;
          
          container.appendChild(card);
        });

      } catch (error) {
        console.error("Error fetching aurora forecast:", error);
        container.innerHTML = '<div id="forecast-msg">Unable to load forecast data at this time. Please try again later.</div>';
      }
    });
  </script>
</section>
<!-- END LIVE AURORA FORECAST SECTION -->
